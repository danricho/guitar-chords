version: "3.8"

services:
  web-server:
    image: nginx:alpine
    container_name: guitar-chords
    restart: "unless-stopped"
    ports:
      - "8088:80" # can be accessed via port http://localhost:8088 if not changed
    volumes:
      - ./web-root:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro #"no-cache" configuration

  auth-proxy:
    image: node:alpine
    restart: "unless-stopped"
    working_dir: /app
    command: node server.js
    volumes:
      # Not :ro — unlike sonos-proxy, this service writes data/auth.json and
      # data/secret_key.txt on first boot (both git-ignored).
      - ./auth-proxy:/app
    # No ports: — only reachable from web-server over the Compose-internal
    # network, via nginx's auth_request + /auth/ (see nginx.conf).

  sonos-proxy:
    image: node:alpine
    restart: "unless-stopped"
    working_dir: /app
    command: node server.js
    environment:
      - SONOS_SPEAKER_UPSTAIRS_IP=192.168.0.40
      - SONOS_SPEAKER_DOWNSTAIRS_IP=192.168.0.50
    volumes:
      - ./sonos-proxy:/app:ro
    # No ports: — only reachable from web-server over the Compose-internal
    # network, proxied through nginx's /api/sonos/ (see nginx.conf).
