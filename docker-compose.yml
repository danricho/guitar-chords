version: "3.8"

services:
  web-server:
    image: nginx:alpine
    container_name: guitar-chords
    restart: "unless-stopped"
    ports:
      - "8088:80" # can be accessed via port http://localhost:8088 if not changed
    volumes:
      - ./web-root:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro #"no-cache" configuration
