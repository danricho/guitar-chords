server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Disable caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;

        # Avoids cache issues with VirtualBox/Docker shared folders
        sendfile off;
    }

    location /api/sonos/ {
        # Docker Compose's embedded DNS (127.0.0.11) resolves the
        # sonos-proxy service name. Using a variable here (rather than a
        # bare hostname in proxy_pass) forces nginx to re-resolve it on
        # every request instead of once at config load, so this keeps
        # working across container restarts regardless of start order.
        resolver 127.0.0.11 valid=30s;
        set $sonos_proxy http://sonos-proxy:3000;
        rewrite ^/api/sonos/(.*)$ /$1 break;
        proxy_pass $sonos_proxy;
    }
}