# The browser's real scheme: nginx sits behind a tunnel/reverse proxy here, so
# its own $scheme is plain http even when the visitor is on HTTPS. auth-proxy
# needs the true value to decide whether the session cookie gets `Secure`.
# (conf.d/*.conf is included in the http context, so `map` is legal here — it
# is not allowed inside the server block below.)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Brute-force cap on the login form. $binary_remote_addr is the *tunnel's*
# address here, not the visitor's, so this is one shared budget for everyone
# rather than per-person — deliberately: the X-Forwarded-For that auth-proxy
# throttles on can be spoofed by anything that reaches nginx directly, and
# this can't be. Sized so a real person never notices (logins are rare).
limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;

server {
    listen 80;
    server_name localhost;

    # Don't advertise the nginx version in responses/error pages.
    server_tokens off;

    # Emit relative Location headers. Without this, `return 302 /auth/login`
    # is absolutised against server_name + $scheme — i.e. "http://localhost/…",
    # which is correct only when browsing the container directly and sends
    # real visitors somewhere that doesn't exist once this is behind a tunnel
    # on its own hostname.
    absolute_redirect off;

    # Header notes: add_header does NOT merge across levels — a location with
    # its own add_header drops every one inherited from here. So all of them
    # live at server level and no location below sets any. Keep it that way.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    # The real no-indexing enforcement: unlike a <meta> tag this also covers
    # the .md Song Charts and other non-HTML files.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Served without auth so crawlers can actually read it — behind the gate
    # they'd get the login page instead and learn nothing.
    location = /robots.txt {
        root /usr/share/nginx/html;
    }

    location / {
        # Every request is bounced off auth-proxy first (see /auth-verify
        # below). Unauthenticated visitors get 401, which becomes a redirect
        # to the login page rather than a bare error.
        auth_request /auth-verify;
        error_page 401 = @login_redirect;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Caching is disabled via the server-level Cache-Control header above
        # (see the header note there before adding any add_header here).
        expires off;

        # Avoids cache issues with VirtualBox/Docker shared folders
        sendfile off;
    }

    # Internal-only subrequest for the auth_request module: auth-proxy answers
    # 204 (valid session cookie) or 401 (not). proxy_pass_request_body off is
    # required — the subrequest must not forward the original request's body.
    location = /auth-verify {
        internal;
        resolver 127.0.0.11 valid=30s;
        # Full target URL in the variable (rather than $base + /verify): a
        # proxy_pass whose target is a variable does not get nginx's usual
        # location-prefix stripping, so the path has to be spelled out here.
        set $auth_verify http://auth-proxy:3000/verify;
        proxy_pass $auth_verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @login_redirect {
        return 302 /auth/login?next=$request_uri;
    }

    # The login page and its form post — deliberately NOT behind
    # auth_request, otherwise signing in would require being signed in.
    location /auth/ {
        # burst+nodelay: a small batch is allowed through immediately (page
        # load plus a mistyped passcode or two), sustained hammering gets 503.
        limit_req zone=login burst=10 nodelay;

        resolver 127.0.0.11 valid=30s;
        # `set` must come before `rewrite`: `break` halts every remaining
        # rewrite-module directive in this block, `set` included.
        set $auth_proxy http://auth-proxy:3000;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $auth_proxy;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/sonos/ {
        # Same gate as the document root — the Sonos controls are part of the
        # app, not a public API.
        auth_request /auth-verify;
        error_page 401 = @login_redirect;

        # Docker Compose's embedded DNS (127.0.0.11) resolves the
        # sonos-proxy service name. Using a variable here (rather than a
        # bare hostname in proxy_pass) forces nginx to re-resolve it on
        # every request instead of once at config load, so this keeps
        # working across container restarts regardless of start order.
        resolver 127.0.0.11 valid=30s;
        set $sonos_proxy http://sonos-proxy:3000;
        rewrite ^/api/sonos/(.*)$ /$1 break;
        proxy_pass $sonos_proxy;
    }
}
