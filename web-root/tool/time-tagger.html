<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ChordPro Timestamp Tool</title>
    <meta name="robots" content="noindex, nofollow" />

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
        padding: 10px;
        gap: 10px;
        touch-action: manipulation;
      }

      #toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      #chart-select {
        flex: 1;
        min-width: 200px;
        font-size: 18px;
        padding: 10px;
        border-radius: 8px;
      }

      #status {
        font-size: 14px;
        opacity: 0.7;
        white-space: nowrap;
      }

      #output {
        flex: 1;
        overflow: auto;
        padding: 10px 14px;
        font-family: ui-monospace, monospace;
        font-size: 18px;
        line-height: 1.6;
        white-space: pre-wrap;
        border: 1px solid #8884;
        border-radius: 8px;
        min-height: 0;
      }

      #current-line {
        background: rgb(60, 255, 0);
        color: #000;
        font-weight: bold;
        display: inline-block;
        min-width: 100%;
        border-radius: 4px;
      }

      #controls {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      #controls button {
        font-size: 16px;
        padding: 16px 6px;
        border-radius: 10px;
        border: 1px solid #8886;
        background: #8881;
        min-height: 56px;
      }

      #controls button:active {
        background: #8884;
      }

      #controls button.primary {
        background: rgb(60, 255, 0, 0.25);
        border-color: rgb(60, 255, 0);
      }

      #edit-panel {
        display: none;
        flex-direction: column;
        gap: 6px;
      }

      #edit-panel.open {
        display: flex;
      }

      #input {
        width: 100%;
        height: 30vh;
        font-family: ui-monospace, monospace;
        font-size: 16px;
      }

      .hint {
        font-size: 11px;
        opacity: 0.6;
      }

      @media (max-width: 600px) {
        #controls {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <div id="toolbar">
      <select id="chart-select">
        <option value="">Loading Song Charts…</option>
      </select>
      <span id="status">Connecting to Spotify…</span>
    </div>

    <pre id="output"></pre>

    <div id="controls">
      <button id="btn-up">⬆ Up</button>
      <button id="btn-down">⬇ Down</button>
      <button id="btn-add" class="primary">＋ Timestamp</button>
      <button id="btn-remove">－ Remove</button>
      <button id="btn-copy">⧉ Copy</button>
    </div>

    <div>
      <button id="btn-edit-toggle" style="font-size: 14px; padding: 8px 12px">
        ✏️ Edit raw text
      </button>
    </div>

    <div id="edit-panel">
      <textarea id="input" placeholder="Paste ChordPro text here, or pick a Song Chart above."></textarea>
      <div class="hint">
        Keyboard (with a real keyboard connected): Arrow Up/Down = move line | T = add timestamp | R = remove timestamp | C = copy output
      </div>
    </div>

    <script src="../static/js/jquery-3.7.1.min.js"></script>
    <script src="../static/js/spotify-settings.js"></script>
    <script src="../static/js/fretboard.js"></script>
    <script src="../static/js/spotify.js"></script>

    <script>
      let lines = [""];
      let currentLine = 0;

      const $status = document.getElementById("status");
      const $output = document.getElementById("output");
      const $input = document.getElementById("input");
      const $chartSelect = document.getElementById("chart-select");

      /**
       * =========================
       * WAIT FOR SPOTIFY READY
       * =========================
       */
      async function waitForSpotify() {
        Spotify.sync.accessToken = await Spotify.ensureValidToken();
        $status.textContent = "Spotify connected ✓";
      }

      /**
       * =========================
       * LOAD SONG CHART REGISTRY
       * =========================
       */
      async function loadChartRegistry() {
        try {
          const res = await fetch("../charts/!registry.json");
          const data = await res.json();
          const entries = data.charts || [];

          $chartSelect.innerHTML =
            '<option value="">— Pick a Song Chart —</option>' +
            entries
              .map((e, i) => {
                const style = e.category === "Creating" ? ' style="font-weight: bold"' : "";
                return `<option value="${i}"${style}>${escapeHtml(e.title)} by ${escapeHtml(e.artist)}</option>`;
              })
              .join("");

          $chartSelect.dataset.loaded = "1";
          $chartSelect.registryEntries = entries;
        } catch (err) {
          console.error(err);
          $chartSelect.innerHTML = '<option value="">Couldn\'t load registry</option>';
        }
      }

      async function loadSelectedChart() {
        const idx = $chartSelect.value;
        if (idx === "") return;
        const entry = $chartSelect.registryEntries[idx];
        if (!entry) return;

        $status.textContent = `Loading "${entry.title}"…`;
        try {
          const res = await fetch(entry.path);
          const text = res.ok ? await res.text() : "";
          $input.value = text;
          loadText();
          $status.textContent = `Editing "${entry.title}"`;
        } catch (err) {
          console.error(err);
          $status.textContent = `Failed to load "${entry.title}"`;
        }
      }

      /**
       * =========================
       * INIT
       * =========================
       */
      window.addEventListener("load", async () => {
        await Promise.all([waitForSpotify(), loadChartRegistry()]);
      });

      /**
       * =========================
       * TEXT HANDLING
       * =========================
       */
      function loadText() {
        lines = $input.value.split("\n");
        currentLine = 0;
        render();
      }

      function render() {
        $output.innerHTML = lines
          .map((l, i) =>
            i === currentLine
              ? `<span id="current-line">➤ ${escapeHtml(l) || "&nbsp;"}</span>`
              : escapeHtml(l),
          )
          .join("\n");

        centerCurrentLine();
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function centerCurrentLine() {
        const current = document.getElementById("current-line");
        if (!current) return;

        $output.scrollTo({
          top: current.offsetTop - $output.clientHeight / 2 + current.offsetHeight / 2,
          behavior: "smooth",
        });
      }

      /**
       * =========================
       * FORMAT
       * =========================
       */
      function formatChordProTimestamp(ms) {
        const totalSec = Math.floor(ms / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `{c:${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}}`;
      }

      /**
       * =========================
       * LIVE POSITION FETCH
       * =========================
       */
      async function getLivePosition() {
        if (!Spotify.sync?.accessToken) return null;

        const res = await Spotify.apiRequest("/me/player");
        if (!res.ok) return null;

        const data = await res.json();
        return data?.progress_ms ?? null;
      }

      /**
       * =========================
       * LINE / TIMESTAMP ACTIONS — shared by buttons and keyboard
       * =========================
       */
      function moveUp() {
        currentLine = Math.max(0, currentLine - 1);
        render();
      }

      function moveDown() {
        currentLine = Math.min(lines.length - 1, currentLine + 1);
        render();
      }

      async function insertTimestamp() {
        const ms = await getLivePosition();
        if (ms == null) {
          $status.textContent = "No live Spotify position — is something playing?";
          return;
        }

        const tag = formatChordProTimestamp(ms);
        lines[currentLine] += " " + tag;

        render();
        syncTextarea();
      }

      function removeTimestamp() {
        lines[currentLine] = lines[currentLine].replace(/\s*\{c:\d{2}:\d{2}\}\s*$/, "");
        render();
        syncTextarea();
      }

      async function copyOutput() {
        await navigator.clipboard.writeText(lines.join("\n"));
        $status.textContent = "Copied to clipboard ✓";
      }

      /** Keep the raw-text editor in sync after a button-driven edit. */
      function syncTextarea() {
        $input.value = lines.join("\n");
      }

      /**
       * =========================
       * BUTTON WIRING
       * =========================
       */
      document.getElementById("btn-up").addEventListener("click", moveUp);
      document.getElementById("btn-down").addEventListener("click", moveDown);
      document.getElementById("btn-add").addEventListener("click", insertTimestamp);
      document.getElementById("btn-remove").addEventListener("click", removeTimestamp);
      document.getElementById("btn-copy").addEventListener("click", copyOutput);

      document.getElementById("btn-edit-toggle").addEventListener("click", () => {
        document.getElementById("edit-panel").classList.toggle("open");
      });

      $chartSelect.addEventListener("change", loadSelectedChart);
      $input.addEventListener("input", loadText);

      /**
       * =========================
       * KEYBOARD CONTROLS (optional, for a real keyboard)
       * =========================
       */
      document.addEventListener("keydown", async (e) => {
        if (document.activeElement === $input || document.activeElement === $chartSelect) return;

        if (e.key === "ArrowUp") {
          e.preventDefault();
          moveUp();
        }
        if (e.key === "ArrowDown") {
          e.preventDefault();
          moveDown();
        }
        if (e.key === "r") {
          e.preventDefault();
          removeTimestamp();
        }
        if (e.key === "t") {
          e.preventDefault();
          await insertTimestamp();
        }
        if (e.key === "c") {
          e.preventDefault();
          await copyOutput();
        }
      });
    </script>
  </body>
</html>
